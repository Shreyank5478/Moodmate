<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MoodMate Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        
        body {
            background: url(https://i.pinimg.com/1200x/71/27/f2/7127f25d62a73125660d5546dc93ddac.jpg) no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        .custom-button {
            background: rgba(255, 255, 255, 0.15);
            /* transparent glass */
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .custom-button:hover {
            background: rgba(0, 188, 212, 0.2);
            border-color: rgba(0, 188, 212, 0.5);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.8);
        }

        .alert {
            border-radius: 12px;
            font-size: 1.2rem;
        }

        h1,
        h2 {
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
        }

.card {
    background-color: rgba(0, 0, 0, 0.6);
    color: #fff;
    border-radius: 15px;
    margin-top: 2rem;
    padding: 1.5rem;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
}

.glass-box {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 1rem 2rem;
    border-radius: 20px;
    font-size: 1.2rem;
    color: #fff;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    transition: 0.3s ease;
}
.glass-box:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
}

    </style>
</head>

<body class="text-center p-5">

    <div class="container mt-4">
        <h1 class="display-4">Your Mood is:</h1>
        <div class="alert alert-info mt-3">
            <strong>{{ mood }}</strong>
        </div>

        <img class="img-fluid rounded-4 mt-3" src="data:image/jpeg;base64,{{ image_data }}" alt="Analyzed photo" style="max-height: 420px;">

        <h2 class="mt-4">Motivational Message:</h2>
        <div class="alert alert-success mt-3">
            {{ message }}
        </div>

        <!-- 🎵 Music Recommendation -->
        <div class="card">
            <h3>🎵 Music Recommendation</h3>
            <p>{{ music }}</p>

            {% if spotify_embed_url %}
            <iframe class="mt-3" style="border-radius:12px" src="{{ spotify_embed_url }}" width="100%" height="80"
                frameborder="0" allowfullscreen
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            {% endif %}

            <!-- Optional: Embed Spotify iframe if available -->
            <!-- Example static embed, remove if not needed -->
            <!-- <div class="mt-3">
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/7GhIk7Il098yCjg4BQjzvb" width="100%" height="80"
                    frameborder="0" allowfullscreen
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"></iframe>
            </div> -->
        </div>

        <a href="/" class="custom-button mt-4">🔁 Analyze Another Image</a>
    </div>

</body>
</html>
